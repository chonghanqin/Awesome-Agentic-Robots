  caption: 'Comparison of works on perception. Compact entries summarize the configurations discussed here. Input lists observations;
    task instructions and queries are omitted. Output and Perception process use shared tags: 3D targets are metric positions
    or poses; object handles are persistent object references; geometric estimation derives metric quantities from depth,
    calibration or point clouds; frontier ranking scores exploration frontiers or candidate viewpoints; visual reasoning yields
    targets or commands rather than answers; verification re-checks a candidate before it is accepted. Paper and Code link
    to the paper and repository; - denotes an unavailable repository link.'
  notes:
  - <sup>a</sup> Simulation uses sensor depth; real-world deployment estimates depth from RGB.
  - <sup>b</sup> Evaluated via offline one-step replay of recorded observations.
