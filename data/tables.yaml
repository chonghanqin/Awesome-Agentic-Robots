  caption: Comparison of orchestration methods, grouped by categories in the text. The decision columns mark how the executor
    is chosen at run time, namely model-based (one LLM or VLM agent, or several communicating agents, decide each call), hybrid
    (a model proposes calls and a rule layer authorizes or triggers them), or rule-based (a preset schedule or stage order
    decides). <em>Routes By</em> is the information used to choose the executor, namely executor capability, execution feedback,
    the task plan, dialogue between agents, or fixed rules. <em>Hands Off To</em> lists the executors that receive control,
    namely learned policies (VLA, WAM, or policy pool), analytic tools (tool set, motion planner, or controller), skill libraries,
    and other agents (robot or human). Paper and Code link to the paper and repository.
